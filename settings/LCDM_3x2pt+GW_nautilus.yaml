      case: simple
      extra: 
      obs_used: ['GC', 'WL', 'GWC', 'GWWL']
      camb_path:
      scale_cut:
        method: ell_cut_like
        value: 200
    use_noiseless_cls: False

sampler:
  nautilus:
    num_threads: 1
    pool: 10
    n_live: 4000
    n_batch: 512
    n_networks: 16

