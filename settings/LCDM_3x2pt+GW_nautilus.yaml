    latex: '\Omega_\mathrm{c} h^2'
    ref:
      dist: norm
      loc: 0.1205579307
      scale: 0.0029
    prior:
      min: 0.1031
      max: 0.1381

  ns:
    latex: 'n_\mathrm{s}'
