    prior:
      min: 53.2
      max: 78.7
    proposal: 0.5
    ref:
      dist: norm
      loc: 67.2
      scale: 2.3

  logA:
    drop: true
    latex: '\log(10^{10} A_\mathrm{s})'
    prior:
      min: 2.876
      max: 3.251
    proposal: 0.001
    ref:
      dist: norm
      loc: 3.051
      scale: 0.040

  As:
    latex: 'A_\mathrm{s}'
    value: 'lambda logA: 1e-10*np.exp(logA)'

  tau: 0.05

  omegab:
    latex: '\Omega_\mathrm{b}'
    derived: 'lambda ombh2, H0: ombh2 / (H0 / 100.0) ** 2'

  omegam:
    latex: '\Omega_\mathrm{m}'
    derived: 'lambda ombh2, omch2, mnu,H0: ombh2 / (H0 / 100.0) ** 2 + omch2 / (H0 / 100.0) ** 2 + (mnu/93.14) / (H0 / 100.0) ** 2'

