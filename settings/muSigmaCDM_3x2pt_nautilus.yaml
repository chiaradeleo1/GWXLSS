output: chains/muSigmaCDM_3x2pt

likelihood:
  LSS: 
    external: LSSlike
    data_path: ./mock_data/new_LSS_muSigmaCDM
    debug_mode: False
    settings:
      case: ['density']
      calculation: CAMB
      extra: 
      camb_path:
    use_noiseless_cls: False

sampler:
  nautilus:
    num_threads: 1
    pool: 10
    n_live: 4000
    n_batch: 512
    n_networks: 16

params:
  ombh2:
    latex: '\Omega_\mathrm{b} h^2'
    prior:
      dist: norm
      loc: 0.0227
      scale: 0.0038
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.0226
      scale: 0.0031

  omch2:
    latex: '\Omega_\mathrm{c} h^2'
    prior:
      min: 0.0795
      max: 0.1545
    proposal: 0.0005
    ref:
      dist: norm
      loc: 0.1215
      scale: 0.0066

  ns:
    latex: 'n_\mathrm{s}'
    prior:
      min: 0.913
      max: 1.013
    proposal: 0.002
    ref:
      dist: norm
      loc: 0.958
      scale: 0.011

  H0:
