output: chains/muSigma_3x2pt_fixednuis_nautilus


likelihood:
  LSS: 
    external: LSSlike
    data_path:  ./mock_data/MGflag_1_test_gal
    debug_mode: False
    settings:
      case: simple
      calculation: CAMB
      extra:
      camb_path:
    use_noiseless_cls: True

sampler: 
  nautilus:
    num_threads: 1
    pool: 10
    n_live: 4000
    n_batch: 512
    n_networks: 16

params:
  ombh2:
    latex: '\Omega_\mathrm{b} h^2'
    prior:
      dist: norm
      loc: 0.0227
      scale: 0.00038 
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.0222
      scale: 0.0001
  omch2:
    latex: '\Omega_\mathrm{c} h^2'
    prior:
      min: 0.01
      max: 0.37
    proposal: 0.0005
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
  ns:
    latex: 'n_\mathrm{s}'
    prior:
      min: 0.87
      max: 1.07
    proposal: 0.002
    ref: 
      dist: norm
      loc: 0.96
      scale: 0.004
  H0:
    latex: 'H_0'
    prior: 
      max: 91.0
      min: 55.0
    proposal: 0.5
    ref:
      dist: norm
      loc: 67.0
      scale: 0.5
  mu0:
    latex: '\mu_0'
    prior: 
      max: 3.0
      min: -3.0
    proposal: 0.001
    ref:
      dist: norm
      loc: -1.23
      scale: 0.1
  sigma0:
    latex: '\Sigma_0'
    prior: 
      max: 3.0
      min: -3.0
    proposal: 0.001
    ref:
      dist: norm
      loc: -0.17
      scale: 0.1
  logA:
    drop: true
    latex: '\log(10^{10} A_\mathrm{s})'
    prior:
      max: 3.9
      min: 1.6
    proposal: 0.001
    ref:
      dist: norm
      loc: 3.05
      scale: 0.1
  As:
    latex: 'A_\mathrm{s}'
    value: 'lambda logA: 1e-10*np.exp(logA)'

  tau: 0.05

  omegab:
    latex: '\Omega_\mathrm{b}'
    derived: 'lambda ombh2, H0: ombh2 / (H0 / 100.0) ** 2'
    
  omegam:
    latex: '\Omega_\mathrm{m}'  
    derived: 'lambda ombh2, omch2, mnu,H0: ombh2 / (H0 / 100.0) ** 2 + omch2 / (H0 / 100.0) ** 2 + (mnu/93.14) / (H0 / 100.0) ** 2 '  
  
    
