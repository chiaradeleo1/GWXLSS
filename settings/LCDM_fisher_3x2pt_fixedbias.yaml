        latex: H_0
      ns:
        fiducial: 0.96
        variation: 0.1
        latex: n_{\rm s}
      logA:
        fiducial: 3.05685
        variation: 0.1
        latex: \log{10^{10}\,A_{\rm s}}
      a0:
        fiducial: -0.007589
        variation: 0.05
        latex: a_0
      a1:
        fiducial: 0.002008
        variation: 0.05
        latex: a_1
      a2:
        fiducial: -0.004127
        variation: 0.05
        latex: a_2
      a3:
        fiducial: -0.0006784
        variation: 0.05
        latex: a_3
      a4:
        fiducial: -0.0006784
