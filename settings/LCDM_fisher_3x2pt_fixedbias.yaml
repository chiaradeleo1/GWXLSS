output: chains/LCDM_fisher_3x2pt_fixedbias

obs_settings:
  extra:
  case: simple
  camb_path: 
  calculation: CAMB

analysis_settings:
  dist_path: ./mock_data/LCDM_test_gal_source_distribution.npy
  lmin: 10
  lmax: 1500
  Nbin_ell: 20
  galaxy_specs:
    fsky: 0.35
    gal_per_arcmin: 30.
    sigma_eps: 0.3

