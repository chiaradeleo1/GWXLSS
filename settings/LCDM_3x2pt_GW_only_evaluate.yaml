output: chains/LCDM_3x2pt_GW_cosmo
force: True
likelihood:
  LSS: 
    external: LSSlike
    data_path: ./mock_data/new_LSS_GW_LCDM
    dist_path: ./mock_data/new_GW_LCDM
    debug_mode: False
    settings:
      case: simple
      calculation: CAMB
      extra: 
      camb_path:
      scale_cut:
        method: ell_cut_like
        value: 200
    use_noiseless_cls: True

sampler: 
  evaluate:

params:
  ombh2:
    latex: '\Omega_\mathrm{b} h^2'
    prior:
      dist: norm
      loc: 0.0227
      scale: 0.0038
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.022445
      scale: 0.0031

  omch2:
    latex: '\Omega_\mathrm{c} h^2'
    ref:
      dist: norm
      loc: 0.1205579307
      scale: 0.0029
    prior:
      min: 0.1031
      max: 0.1381

  ns:
    latex: 'n_\mathrm{s}'
    ref:
      dist: norm
      loc: 0.96
      scale: 0.0084
    prior:
      min: 0.9095
      max: 1.0103

  H0:
    latex: 'H_0'
    ref:
      dist: norm
      loc: 67.
      scale: 0.79
    prior:
      min: 62.27
      max: 71.75

  logA:
    drop: true
    latex: '\log(10^{10} A_\mathrm{s})'
    ref:
      dist: norm
      loc: 3.05685
      scale: 0.027
    prior:
      min: 2.895
      max: 3.219

  As:
    latex: 'A_\mathrm{s}'
    value: 'lambda logA: 1e-10*np.exp(logA)'

  tau: 0.05

  omegab:
    latex: '\Omega_\mathrm{b}'
    derived: 'lambda ombh2, H0: ombh2 / (H0 / 100.0) ** 2'

  omegam:
    latex: '\Omega_\mathrm{m}'
    derived: 'lambda ombh2, omch2, mnu,H0: ombh2 / (H0 / 100.0) ** 2 + omch2 / (H0 / 100.0) ** 2 + (mnu/93.14) / (H0 / 100.0) ** 2'

  b0_poly_GW:
    latex: 'b_0^{\rm GW}'
    ref:
      dist: norm
      loc: 0.830703
      scale: 0.0034
    prior:
      min: 0.8107
      max: 0.8507

  b1_poly_GW:
    latex: 'b_1^{\rm GW}'
    ref:
      dist: norm
      loc: 1.190547
      scale: 0.0082
    prior:
      min: 1.1413
      max: 1.2397

  b2_poly_GW:
    latex: 'b_2^{\rm GW}'
    ref:
      dist: norm
      loc: -0.928357
      scale: 0.0089
    prior:
      min: -0.9827
      max: -0.8740

  b3_poly_GW:
    latex: 'b_3^{\rm GW}'
    ref:
      dist: norm
      loc: 0.423292
      scale: 0.0028
    prior:
      min: 0.4065
      max: 0.4401

  b0_poly: 0.830703
  b1_poly: 1.190547
  b2_poly: -0.928357
  b3_poly: 0.423292
  a0: -0.007589
  a1: 0.002008
  a2: -0.004127
  a3: 0.002918
  a4: -0.0006784
  w: -1.
  wa: 0.
  mnu: 0.06
  mu0: 0.
  sigma0: 0.
  MG_flag: 1
  pure_MG_flag: 2
  musigma_par: 1
  DE_model: 0