likelihood:
  LSS:
    external: !!python/name:source_code.likelihood.LSSlike ''
    data_path: ./mock_data/EFTflag_1_test_galonly_IApoly
    debug_mode: false
    camb_path: /users/chiaradeleo/Desktop/myeftcamb-main
    use_noiseless_cls: true
params:
  ombh2:
    latex: \Omega_\mathrm{b} h^2
    prior:
      min: 0.005
      max: 0.1
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.0222
      scale: 0.0001
  omch2:
    latex: \Omega_\mathrm{c} h^2
    prior:
      min: 0.002
      max: 0.99
    proposal: 0.0005
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
  ns:
    latex: n_\mathrm{s}
    prior:
      min: 0.6
      max: 1.2
    proposal: 0.002
    ref:
      dist: norm
      loc: 0.96
      scale: 0.004
  H0:
    latex: H_0
    prior:
      max: 100.0
      min: 20.0
    proposal: 0.5
    ref:
      dist: norm
      loc: 67.0
      scale: 0.5
  logA:
    drop: true
    latex: \log(10^{10} A_\mathrm{s})
    prior:
      max: 7.0
      min: 1.6
    proposal: 0.001
    ref:
      dist: norm
      loc: 3.05
      scale: 0.1
  As:
    latex: A_\mathrm{s}
    value: 'lambda logA: 1e-10*np.exp(logA)'
  tau: 0.05
  omegab:
    latex: \Omega_\mathrm{b}
    value: 'lambda ombh2, H0: ombh2 / (H0 / 100.0) ** 2'
  omegam:
    latex: \Omega_\mathrm{m}
    value: 'lambda ombh2, omch2, H0: ombh2 / (H0 / 100.0) ** 2 + omch2 / (H0 / 100.0)
      ** 2'
  a0: -0.007589
  a1: 0.002008
  a2: -0.004127
  a3: 0.002918
  a4: -0.0006784
  b0_poly: 0.830703
  b1_poly: 1.190547
  b2_poly: -0.928357
  b3_poly: 0.423292
  w: -1.0
  wa: 0.0
  mnu: 0.06
sampler:
  mcmc:
    oversample_power: 1
    covmat:
      path: covariance_matrix.covmat
    max_tries: 10000
output: 3x2pt_LCDM_MH
extra:
  EFT_ghost_math_stability: false
  EFT_mass_math_stability: false
  EFT_ghost_stability: false
  EFT_gradient_stability: false
  EFT_mass_stability: false
  EFT_additional_priors: false
  EFTflag: 1
  PureEFTmodel: 1
  PureEFTmodelOmega: 3
  EFTOmega0:
    latex: Omega_0
    prior:
      min: -0.1
      max: -0.001
    proposal: 0.0001
    ref:
      dist: norm
      loc: -0.019
      scale: 0.0001
  EFTOmegaExp:
    latex: \beta
    prior:
      min: 0.4
      max: 1.0
    proposal: 0.002
    ref:
      dist: norm
      loc: 0.66
      scale: 0.004
