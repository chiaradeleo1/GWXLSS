theory: null
likelihood:
  LSS:
    aliases:
    - LSS
    speed: 500
    case: simple
    extra:
      EFT_ghost_math_stability: false
      EFT_mass_math_stability: false
      EFT_ghost_stability: false
      EFT_gradient_stability: false
      EFT_mass_stability: false
      EFT_additional_priors: false
      EFTflag: 1
      PureEFTmodel: 1
      PureEFTmodelOmega: 3
      EFTOmega0: -0.019
      EFTOmegaExp: 0.66
    k_max_extrap: 1000000.0
    k_min_extrap: 1.0e-05
    camb_path: /users/chiaradeleo/Desktop/myeftcamb-main
    data_path: ./mock_data/EFTflag_1_test_galonly_IApoly
    use_noiseless_cls: true
    debug_mode: false
    type: []
    stop_at_error: false
    version: null
    external: !!python/name:source_code.likelihood.LSSlike ''
    input_params:
    - ombh2
    - omch2
    - ns
    - H0
    - As
    - tau
    - omegab
    - omegam
    - a0
    - a1
    - a2
    - a3
    - a4
    - b0_poly
    - b1_poly
    - b2_poly
    - b3_poly
    - w
    - wa
    - mnu
    output_params: []
params:
  ombh2:
    latex: \Omega_\mathrm{b} h^2
    prior:
      min: 0.005
      max: 0.1
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.0222
      scale: 0.0001
  omch2:
    latex: \Omega_\mathrm{c} h^2
    prior:
      min: 0.002
      max: 0.99
    proposal: 0.0005
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
  ns:
    latex: n_\mathrm{s}
    prior:
      min: 0.6
      max: 1.2
    proposal: 0.002
    ref:
      dist: norm
      loc: 0.96
      scale: 0.004
  H0:
    latex: H_0
    prior:
      max: 100.0
      min: 20.0
    proposal: 0.5
    ref:
      dist: norm
      loc: 67.0
      scale: 0.5
  logA:
    drop: true
    latex: \log(10^{10} A_\mathrm{s})
    prior:
      max: 7.0
      min: 1.6
    proposal: 0.001
    ref:
      dist: norm
      loc: 3.05
      scale: 0.1
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
  tau:
    value: 0.05
  omegab:
    value: 'lambda ombh2, H0: ombh2 / (H0 / 100.0) ** 2'
    latex: \Omega_\mathrm{b}
    derived: true
  omegam:
    value: 'lambda ombh2, omch2, H0: ombh2 / (H0 / 100.0) ** 2 + omch2 / (H0 / 100.0)
      ** 2'
    latex: \Omega_\mathrm{m}
    derived: true
  a0:
    value: -0.007589
  a1:
    value: 0.002008
  a2:
    value: -0.004127
  a3:
    value: 0.002918
  a4:
    value: -0.0006784
  b0_poly:
    value: 0.830703
  b1_poly:
    value: 1.190547
  b2_poly:
    value: -0.928357
  b3_poly:
    value: 0.423292
  w:
    value: -1.0
  wa:
    value: 0.0
  mnu:
    value: 0.06
sampler:
  mcmc:
    burn_in: 0
    max_tries: 10000
    covmat:
      path: covariance_matrix.covmat
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 1
    oversample_thin: true
    drag: false
    blocking: null
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: null
output: 3x2pt_LCDM_MH
extra:
